# media-proxy-rs のレスポンスをキャッシュする nginx 設定例。
# http ブロックに include して使う。
#
# 使い方: proxy_cache_path をディスク容量に合わせて調整し、upstream のアドレスを
# media-proxy-rs の bind_addr に設定する。encode_avif にも留意すること。
# true の場合、レスポンスは Accept ヘッダーに依存する。
#
# キャッシュキーについて: media-proxy-rs が読み取るのは url パラメータと
# 6つのフラグ (avatar, preview, badge, emoji, static, fallback) だけ。
# リクエストパスはレスポンスを変えないため、キーには含めない。
# フラグは値ではなく有無で判定されるため、1/0 に正規化する。
# ?preview と ?preview=1 は同じ意味。クエリの並び順と、上記以外の
# パラメータはキーに影響しない。
#
# プロキシは Vary: Accept,Range を返す。Accept への依存はキャッシュキーで
# 再現する。Range は上流へ転送し、キャッシュへ読み書きしないためキーに
# 含めない。上流の Vary ヘッダーは無視する。
#
# サイズ制限: キャッシュ領域全体は max_size=10g で上限を設ける。
# 1ファイルあたりの上限を指定するディレクティブは nginx にないため、
# 上の map と proxy_no_cache で実現する。204800 バイト (200KiB) 以下の
# 応答だけが保存され、それより大きい応答と Content-Length が無い応答
# (チャンク転送) は保存しない。Range リクエストの応答 (部分ファイル) も
# 保存しない。変換後の画像の大きさは config.json の max_pixels と
# webp_quality で決まる。

proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:100m
                 max_size=10g inactive=30d use_temp_path=off;
# キャッシュディレクトリは nginx ワーカープロセスから書き込み可能にする。
# 公式 nginx イメージではこのパスにボリュームをマウントする。
#
# max_size はキャッシュ領域全体の上限。超過分は cache manager が
# 直近に使われた順で削除する。チェックは非同期なので、
# ディレクトリが一時的に 10g を超えることがある。

# フラグの有無を 1/0 に正規化する
map $args $k_avatar   { default 0; "~(^|&)avatar(=|&|$)"   1; }
map $args $k_preview  { default 0; "~(^|&)preview(=|&|$)"  1; }
map $args $k_badge    { default 0; "~(^|&)badge(=|&|$)"    1; }
map $args $k_emoji    { default 0; "~(^|&)emoji(=|&|$)"    1; }
map $args $k_static   { default 0; "~(^|&)static(=|&|$)"   1; }
map $args $k_fallback { default 0; "~(^|&)fallback(=|&|$)" 1; }

# フラグの判定は生 (未デコード) の $args を見る。map はデコード済みの値を
# 提供しないため、キー名をパーセントエンコードした要求は正規化できない。
# プロキシはキー名をデコードするので ?url=X&%61vatar=1 は avatar フラグ付きの
# 要求になる。nginx はフラグ無しでキャッシュするため、以後の ?url=X に
# avatar 用の寸法で変換された画像が配信されえる。同じ理由で ?%75rl=... は
# この設定では 400 で拒否される (プロキシ単体では通る)。必要なら njs か
# perl モジュールでクエリを正規化すること。

# encode_avif が true のときだけレスポンスが Accept に依存する。
# false ならこの map とキー中の $k_avif は不要。
# プロキシは Accept をカンマで分割し、各トークンを trim して大文字小文字を
# 無視して image/avif と完全一致させる。下の正規表現もトークン全体に一致
# させ、image/avif;q=0.9 や image/avifs を AVIF として扱わない。
# 残る差分: nginx は繰り返された Accept ヘッダーを ", " で連結して評価するが
# プロキシは最初の 1 個だけを読む。
map $http_accept $k_avif {
    default 0;
    "~*(^|,)[[:space:]]*image/avif[[:space:]]*(,|$)" 1;
}

# url が無い、url が空、url が複数ある要求は 400 で拒否する。
# nginx は最初の url= の値しか読まないため、重複するとある応答が別の url
# のキーの下に保存されてしまう。map は正規表現を上から順に評価する。
# nginx はクエリパラメータ名を大文字小文字を無視して探すのに対し、プロキシは
# url を大文字小文字を区別して読み、URL は未知のフィールドとして無視する。
# そのためパターンを ~* にした。?URL=<キー文字列>&url=<攻撃者URL> を素通しすると
# 攻撃者のコンテンツがキー文字列のエントリとして保存される (web cache
# poisoning)。URL= だけの要求は 0 (素通し) になるが、プロキシが url 欠落で
# 400 を返すのでキャッシュは残らない。
# 空の url= と = の無い url も 400 にしている。url が無い要求は nginx も
# プロキシも 400 で一致する。プロキシ単体は url が空で fallback が有る時に
# だけ 200 とダミー PNG を返す (README 参照)。
map $args $bad_query {
    default              1;
    "~*(^|&)url=.*&url=" 1;
    "~*(^|&)url=[^&]+"   0;
}

# Range ヘッダーがある要求は 1、無い要求は 0 になる
map $http_range $k_range { default 1; "" 0; }

# 1ファイルあたりのキャッシュ上限。nginx にはこのためのディレクティブがない
# ため、上流の Content-Length からサイズを読む。proxy_no_cache は上流の
# ヘッダーを受け取った後に評価されるので、この時点で
# $upstream_http_content_length は確定している。
# 1 がキャッシュしない意味で、204800 バイト (200KiB) より大きい値に相当する。
# 値が無い場合 (チャンク転送) は default になり、キャッシュしない。
map $upstream_http_content_length $k_too_big {
    default               1;
    "~^[0-9]{1,5}$"       0;
    "~^1[0-9]{5}$"        0;
    "~^20[0-3][0-9]{3}$"  0;
    "~^204[0-7][0-9]{2}$" 0;
    "~^204800$"           0;
    # 上の正規表現は 0 から 204800 までを並べただけ。204801 以上は
    # どれにも合わないので default になる
    # 境界値は nginx 1.27 と Docker のイメージで確認済み。204800 バイトは
    # 保存され、204801 バイトと Content-Length の無いチャンク転送は
    # 保存されなかった
}

upstream media_proxy {
    # bind_addr が unix:// の場合は server unix:/run/media-proxy/proxy.sock;
    server 127.0.0.1:12766;
    keepalive 16;
}

server {
    listen 80;
    server_name media.example.com;

    location = /healthz {
        proxy_pass http://media_proxy;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location / {
        if ($bad_query) {
            return 400;
        }

        proxy_pass http://media_proxy;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # クライアントの Range は上流 (プロキシ) へ渡す。プロキシは Range を
        # 受け取ると元サーバーへ中継し、206 と Content-Range をそのまま返す。
        # ブラウザで安全な素通し (動画と音声) には
        # Cache-Control: max-age=31536000, immutable が付く。
        # この部分応答のボディを Range を含まないキーでキャッシュすると、部分的
        # なファイルが完全なファイルとして保存されてしまう。だから Range
        # リクエストはキャッシュを参照せず、保存もしない (下の
        # proxy_cache_bypass と proxy_no_cache)。キャッシュされるのは Range の
        # 無い応答だけなので、保存されたファイルは常に完全なファイルになる。
        # 画像の Range も元サーバーへ中継される。画像は部分データで再エンコード
        # され、壊れた Preview がそのクライアントへ 1 回だけ配信される
        # (キャッシュはされない。下の slice の注記と同じ不具合)。
        # 注意: proxy_cache が有効な location では、nginx はキャッシュのために
        # 上流への要求から Range ヘッダーを取り除く (範囲配信は nginx が
        # キャッシュから行う)。これがないと Range は上流へ届かず、常に完全な
        # ファイルが取得される。だから proxy_set_header で再設定する。
        # nginx 1.27.5 と試験用の上流で確認した: Range 要求は元サーバーの 206 が
        # 届き X-Cache-Status は BYPASS、その後の Range 無し要求は HIT で完全な
        # ファイルが返った (部分ファイルがエントリを壊していない)。
        # 上流にキャッシュを付けない構成では Range はそのまま届くことも確認した。
        # キャッシュからのバイト範囲配信は行わないので proxy_force_ranges は
        # 使わない。
        proxy_set_header Range $http_range;
        proxy_cache_bypass $k_range;

        # 1ファイル上限で試験して不採用にしたもの:
        # - proxy_max_temp_file_size 0 と proxy_buffers 204800 バイト分。
        #   バッファを超える 409600 バイトの応答がそのままキャッシュされた
        # - proxy_cache を上流の Content-Length の map で切り替える方法。
        #   nginx は proxy_cache の変数を応答前に解決するため zone が常に off に
        #   なり、何もキャッシュされなかった
        # - slice モジュールでキャッシュを分割して 1ファイル上限を真似ること。
        #   スライスした Range をメディアプロキシが元サーバーへ転送すると、画像は
        #   部分データだけで再エンコードされ、壊れた Preview が plain な画像として
        #   キャッシュ・配信される (200KB 超の画像で再現を確認済み)
        # 採用したのは下の proxy_no_cache。上流のヘッダーを受け取った後に
        # 評価されるので、サイズで判断できる
        proxy_cache media;
        # $k_too_big が 1 の応答と Range リクエストの応答はキャッシュせず、
        # クライアントへそのまま返す。Content-Length が無い応答は map の
        # default で 1 になり、キャッシュしない
        proxy_no_cache $k_too_big $k_range;
        proxy_ignore_headers Vary;
        # Range はキャッシュへ読み書きしないのでキーに含めない。
        # 依存するのは url とフラグの有無と (encode_avif が true なら) Accept。
        proxy_cache_key "$scheme$host|$arg_url|$k_avatar$k_preview$k_badge$k_emoji$k_static$k_fallback|$k_avif";

        # 上流の Cache-Control を尊重する。変換後とブラウザで安全な素通しは
        # max-age=31536000, immutable、それ以外は max-age=300。
        # proxy_cache_valid は設定していないので、Cache-Control が無い応答は
        # キャッシュされない。プロキシは成功する応答に常に Cache-Control を付ける
        # (nginx 1.27.5 と試験用の上流で、Cache-Control 無しは保存されないことを
        # 確認した)。

        # 画像変換は重いため、同一キーの同時リクエストは1本にまとめる
        proxy_cache_lock on;
        proxy_cache_lock_timeout 60s;
        proxy_cache_lock_age 60s;
        # 更新中と上流の障害時は古いキャッシュを返し続ける
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;

        # 画像変換は時間がかかるため、読み取りは長めに待つ
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;

        # HIT/MISS 確認用。運用で不要なら削除する
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
