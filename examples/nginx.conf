# media-proxy-rs のレスポンスをキャッシュする nginx 設定例。
# http ブロックに include して使う。
#
# 使い方: proxy_cache_path をディスク容量に合わせて調整し、upstream のアドレスを
# media-proxy-rs の bind_addr に設定する。encode_avif にも留意すること。
# true の場合、レスポンスは Accept ヘッダーに依存する。
#
# キャッシュキーについて: media-proxy-rs が読み取るのは url パラメータと
# 6つのフラグ (avatar, preview, badge, emoji, static, fallback) だけ。
# リクエストパスはレスポンスを変えないため、キーには含めない。
# フラグは値ではなく有無で判定されるため、1/0 に正規化する。
# ?preview と ?preview=1 は同じ意味。クエリの並び順と、上記以外の
# パラメータはキーに影響しない。
#
# プロキシは Vary: Accept,Range を返す。分離を nginx の Vary 処理に任せると
# Range リクエストごとにキャッシュが分かれてしまうため、Vary は無視して
# キャッシュキー側で再現する。
#
# サイズ制限: キャッシュ領域全体は max_size=10g で上限を設ける。
# 1ファイルあたりの上限を指定するディレクティブは nginx にないため、
# 上の map と proxy_no_cache で実現する。204800 バイト (200KiB) 以下の
# 応答だけが保存され、それより大きい応答と Content-Length が無い応答
# (チャンク転送) は保存しない。変換後の画像の大きさは config.json の
# max_pixels と webp_quality で決まる。

proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:100m
                 max_size=10g inactive=30d use_temp_path=off;
# キャッシュディレクトリは nginx ワーカープロセスから書き込み可能にする。
# 公式 nginx イメージではこのパスにボリュームをマウントする。
#
# max_size はキャッシュ領域全体の上限。超過分は cache manager が
# 直近に使われた順で削除する。チェックは非同期なので、
# ディレクトリが一時的に 10g を超えることがある。

# フラグの有無を 1/0 に正規化する
map $args $k_avatar   { default 0; "~(^|&)avatar(=|&|$)"   1; }
map $args $k_preview  { default 0; "~(^|&)preview(=|&|$)"  1; }
map $args $k_badge    { default 0; "~(^|&)badge(=|&|$)"    1; }
map $args $k_emoji    { default 0; "~(^|&)emoji(=|&|$)"    1; }
map $args $k_static   { default 0; "~(^|&)static(=|&|$)"   1; }
map $args $k_fallback { default 0; "~(^|&)fallback(=|&|$)" 1; }

# encode_avif が true のときだけレスポンスが Accept で変わる。
# false ならこの map とキー中の $k_avif は不要。
map $http_accept $k_avif { default 0; "~*image/avif" 1; }

# url が無い、または url が複数ある要求は拒否する。
# nginx は最初の url= の値しか読まないため、重複するとある応答が別の url
# のキーの下に保存されてしまう。map は正規表現を上から順に評価する。
map $args $bad_query {
    default             1;
    "~(^|&)url=.*&url=" 1;
    "~(^|&)url=[^&]+"   0;
}

# 1ファイルあたりのキャッシュ上限。nginx にはこのためのディレクティブがない
# ため、上流の Content-Length からサイズを読む。proxy_no_cache は上流の
# ヘッダーを受け取った後に評価されるので、この時点で
# $upstream_http_content_length は確定している。
# 1 がキャッシュしない意味で、204800 バイト (200KiB) より大きい値に相当する。
# 値が無い場合 (チャンク転送) と 1 桁の値は default になり、キャッシュしない。
map $upstream_http_content_length $k_too_big {
    default               1;
    "~^[0-9]{1,5}$"       0;
    "~^1[0-9]{5}$"        0;
    "~^20[0-3][0-9]{3}$"  0;
    "~^204[0-7][0-9]{2}$" 0;
    "~^204800$"           0;
    # 上の正規表現は 0 から 204800 までを並べただけ。204801 以上は
    # どれにも合わないので default になる
    # 境界値は nginx 1.27 と Docker のイメージで確認済み。204800 バイトは
    # 保存され、204801 バイトと Content-Length の無いチャンク転送は
    # 保存されなかった
}

upstream media_proxy {
    # bind_addr が unix:// の場合は server unix:/run/media-proxy/proxy.sock;
    server 127.0.0.1:12766;
    keepalive 16;
}

server {
    listen 80;
    server_name media.example.com;

    location = /healthz {
        proxy_pass http://media_proxy;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location / {
        if ($bad_query) {
            return 400;
        }

        proxy_pass http://media_proxy;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # クライアントの Range は上流へ渡さない。上流は常に完全なファイルを
        # 返し、nginx はキャッシュからバイト範囲を応答する。これでキーは
        # Range に依存しない。キャッシュ済みレスポンスの範囲を配信するには
        # proxy_force_ranges が必要。
        # 注意: slice モジュールでキャッシュを分割して 1ファイル上限を真似ることは
        # できない。スライスした Range をメディアプロキシが元サーバーへ転送すると、
        # 画像は部分データだけで再エンコードされ、壊れた Preview が plain な
        # 画像としてキャッシュ・配信される (200KB 超の画像で再現を確認済み)。
        proxy_set_header Range "";
        proxy_force_ranges on;

        # 1ファイル上限で試験して不採用にしたもの:
        # - proxy_max_temp_file_size 0 と proxy_buffers 204800 バイト分。
        #   バッファを超える 409600 バイトの応答がそのままキャッシュされた
        # - proxy_cache を上流の Content-Length の map で切り替える方法。
        #   nginx は proxy_cache の変数を応答前に解決するため zone が常に off に
        #   なり、何もキャッシュされなかった
        # 採用したのは下の proxy_no_cache。上流のヘッダーを受け取った後に
        # 評価されるので、サイズで判断できる
        proxy_cache media;
        # $k_too_big が 1 の応答はキャッシュせず、クライアントへそのまま返す。
        # Content-Length が無い応答は map の default で 1 になり、キャッシュしない
        proxy_no_cache $k_too_big;
        proxy_ignore_headers Vary;
        proxy_cache_key "$scheme$host|$arg_url|$k_avatar$k_preview$k_badge$k_emoji$k_static$k_fallback|$k_avif";

        # 上流の Cache-Control を尊重する。変換後とブラウザで安全な素通しは
        # max-age=31536000, immutable、それ以外は max-age=300。

        # 画像変換は重いため、同一キーの同時リクエストは1本にまとめる
        proxy_cache_lock on;
        proxy_cache_lock_timeout 60s;
        proxy_cache_lock_age 60s;
        # 更新中と上流の障害時は古いキャッシュを返し続ける
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;

        # 画像変換は時間がかかるため、読み取りは長めに待つ
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;

        # HIT/MISS 確認用。運用で不要なら削除する
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
