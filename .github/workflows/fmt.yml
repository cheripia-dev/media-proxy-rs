name: cargo fmt check

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable with rustfmt
        # dtolnay/rust-toolchain は `toolchain` 入力を省略すると uses: の ref を
        # ツールチェーン名として使う (@stable なら stable を入れる)。SHA 固定では
        # ref が 40 桁文字列になるため、toolchain 入力の明示が必須。
        # SHA は master ブランチ履歴内のものを選ぶこと。履歴外のコミット
        # (stable / nightly 等のブランチ先端) はいつかガベージコレクションされて
        # workflow が失敗する (README に明記あり)。他のジョブと同じ master の SHA に
        # 統一し、stable 側は入力で指定する。
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        id: fmt
        continue-on-error: true
        run: |
          set +e
          cargo fmt --all -- --check
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Post comment on failure
        if: github.event_name == 'pull_request' && steps.fmt.outputs.exit_code != '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- cargo-fmt-check -->';
            const body = `${marker}
            ## :warning: cargo fmt チェック失敗

            \`cargo fmt\` を実行してください。
            `;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((c) =>
              c.body && c.body.includes(marker) && c.user && (c.user.login === 'github-actions[bot]' || c.user.type === 'Bot')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Resolve comment on success
        if: github.event_name == 'pull_request' && steps.fmt.outputs.exit_code == '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- cargo-fmt-check -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((c) =>
              c.body && c.body.includes(marker) && c.user && (c.user.login === 'github-actions[bot]' || c.user.type === 'Bot')
            );
            if (existing && existing.body.includes('チェック失敗')) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: `${marker}\n## :white_check_mark: cargo fmt チェック通過`,
              });
            }

      - name: Fail if unformatted
        if: steps.fmt.outputs.exit_code != '0'
        run: |
          echo "::error::cargo fmt --check failed. Run 'cargo fmt' locally and push again."
          exit 1
